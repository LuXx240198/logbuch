/* ---- Standalone-Betrieb (GitHub Pages): Speicher via localStorage ---- */
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
};

const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ---- Icons als eingebettetes SVG (Ersatz fuer lucide-react) ---- */

/* ------------------------------------------------------------------ */
/*  Persistenz — nutzt window.storage, fällt sauber auf RAM zurück     */
/* ------------------------------------------------------------------ */
const store = {
  async get(key) {
    try {
      if (!window.storage) return null;
      const r = await window.storage.get(key);
      return r ? r.value : null;
    } catch {
      return null;
    }
  },
  async set(key, val) {
    try {
      if (!window.storage) return;
      await window.storage.set(key, val);
    } catch {
      /* App läuft auch ohne Speichern weiter */
    }
  },
};

/* ------------------------------------------------------------------ */
/*  Helfer                                                             */
/* ------------------------------------------------------------------ */
const uid = () => Math.random().toString(36).slice(2, 10);
const isoLocal = (d = new Date()) => {
  const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return z.toISOString().slice(0, 10);
};
const norm = (s) => (s || "").trim().toLowerCase();
const fmt = (n) => String(+Number(n || 0).toFixed(2));
const num = (v) => {
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
};
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.round(s) % 60).padStart(2, "0")}`;
const formatDe = (iso) =>
  new Date(iso + "T00:00:00").toLocaleDateString("de-DE", {
    weekday: "long",
    day: "numeric",
    month: "long",
  });
const daysAgo = (iso) =>
  Math.round(
    (new Date(isoLocal() + "T00:00:00") - new Date(iso + "T00:00:00")) / 86400000
  );

const topSet = (sets) => {
  const valid = sets.filter((s) => num(s.weight) > 0 && num(s.reps) > 0);
  if (!valid.length) return null;
  return valid.reduce((best, s) =>
    num(s.weight) > num(best.weight) ||
    (num(s.weight) === num(best.weight) && num(s.reps) > num(best.reps))
      ? s
      : best
  );
};
const volume = (sets) =>
  sets.reduce((sum, s) => sum + num(s.reps) * num(s.weight), 0);
const hasData = (session) =>
  session.exercises.some((e) => e.sets.some((s) => num(s.weight) > 0 || num(s.reps) > 0));

  Schultern: ["Schulterdrücken LH", "Schulterdrücken KH", "Seitheben", "Frontheben", "Reverse Butterfly", "Face Pulls", "Nackenziehen"],
  Bizeps: ["Langhantel-Curls", "Kurzhantel-Curls", "Hammer-Curls", "SZ-Curls", "Konzentrationscurls", "Kabel-Curls"],
  Trizeps: ["Trizepsdrücken Kabel", "Enges Bankdrücken", "French Press", "Trizeps-Kickbacks", "Overhead-Trizeps"],

};

/* IPF-Hantelscheiben-Farben ---------------------------------------- */
const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
const PLATE_COLOR = { 25: "#DC2626", 20: "#2563EB", 15: "#EAB308", 10: "#16A34A", 5: "#E5E5E5", 2.5: "#71717A", 1.25: "#A1A1AA" };
const plateBreakdown = (weight, bar = 20) => {
  let perSide = (weight - bar) / 2;
  if (!isFinite(perSide) || perSide <= 0) return [];
  const out = [];
  for (const p of PLATES) {
    while (perSide >= p - 0.001) {
      out.push(p);
      perSide = +(perSide - p).toFixed(3);
    }
  }
  return out;
};

const deltaColor = (d) => (d > 0 ? "#34D399" : d < 0 ? "#FBBF24" : "#71717A");
const deltaText = (d) => (d > 0 ? `▲ +${fmt(d)}` : d < 0 ? `▼ −${fmt(Math.abs(d))}` : "±0");

const GRID = { display: "grid", gridTemplateColumns: "28px 1fr 1fr 64px" };
const RED = "#2563EB";
const inputCls =
  "rounded-xl bg-neutral-900 border border-neutral-800 px-4 py-3 text-neutral-100 placeholder-neutral-600 outline-none focus:ring-2 focus:ring-blue-500";

/*  Kleine Bausteine                                                   */

function Segmented({ value, onChange, options }) {
  return (
    <div className="inline-flex rounded-full bg-neutral-800 p-1 gap-1">
      {options.map((o) => {
        const active = o.value === value;
        return (
          <button
            key={o.value}
            onClick={() => onChange(o.value)}
            className={
              "px-4 py-1.5 rounded-full text-sm font-medium transition-colors flex items-center gap-1.5 " +
              (active ? "text-neutral-900" : "text-neutral-400")
            }
            style={active ? { backgroundColor: "#F5F5F4" } : {}}
          >
            {o.icon}
            {o.label}
          </button>
        );
      })}
    </div>
  );
}

function NumField({ value, onChange, step, min = 0, ariaLabel }) {
  const bump = (d) => {
    const base = value === "" ? 0 : num(value);
    onChange(String(Math.max(min, +(base + d).toFixed(2))));
  };
  return (
    <div className="flex items-center gap-1">
      <button onClick={() => bump(-step)} aria-label="weniger" className="w-7 h-9 shrink-0 rounded-md bg-neutral-800 text-neutral-400 text-lg leading-none active:bg-neutral-700">
        −
      </button>
      <input
        inputMode="decimal"
        aria-label={ariaLabel}
        value={value}
        onChange={(e) => onChange(e.target.value.replace(",", "."))}
        placeholder="0"
        className="w-14 h-9 rounded-md bg-neutral-800 text-center font-mono tabular-nums text-neutral-100 text-base outline-none focus:ring-2 focus:ring-blue-500"
      />
      <button onClick={() => bump(step)} aria-label="mehr" className="w-7 h-9 shrink-0 rounded-md bg-neutral-800 text-neutral-400 text-lg leading-none active:bg-neutral-700">
        +
      </button>
    </div>
  );
}

function PlateBar({ weight }) {
  const plates = plateBreakdown(weight);
  const h = (p) => 18 + (p / 25) * 30;
  const Plate = ({ p }) => (
    <div
      title={`${p} kg`}
      style={{
        width: 7,
        height: h(p),
        backgroundColor: PLATE_COLOR[p],

  return (
    <div className="flex items-center justify-center gap-0.5 py-1">
      {plates.slice().reverse().map((p, i) => (
        <Plate p={p} key={"l" + i} />
      ))}
      <div style={{ width: 5, height: 12, backgroundColor: "#52525B", borderRadius: 1 }} />
      <div style={{ width: 34, height: 6, backgroundColor: "#71717A", borderRadius: 3 }} />
      <div style={{ width: 5, height: 12, backgroundColor: "#52525B", borderRadius: 1 }} />
      {plates.map((p, i) => (
        <Plate p={p} key={"r" + i} />
      ))}
    </div>
  );
}

/* ================================================================== */
/*  Satzpausen-Timer                                                   */
/* ================================================================== */
function RestTimer({ seconds, setSeconds }) {
  const [remaining, setRemaining] = useState(null); // null = bereit
  const [running, setRunning] = useState(false);
  const [flash, setFlash] = useState(false);
  const endRef = useRef(0);
  const ctxRef = useRef(null);

  const ensureCtx = () => {
    try {
      if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      if (ctxRef.current.state === "suspended") ctxRef.current.resume();
    } catch {}
  };
  const beep = (ctx, start, freq) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g);
    g.connect(ctx.destination);
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(0.35, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 0.16);
    o.start(start);
    o.stop(start + 0.2);
  };
  const alertDone = () => {
    try {
      ensureCtx();
      const ctx = ctxRef.current;
      if (ctx) {
        const t = ctx.currentTime;
        beep(ctx, t, 880);
        beep(ctx, t + 0.22, 880);
        beep(ctx, t + 0.44, 1175);
      }
    } catch {}
    try {
      if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
    } catch {}
  };

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => {
      const ms = endRef.current - Date.now();
      setRemaining(Math.max(0, Math.ceil(ms / 1000)));
      if (ms <= 0) {
        clearInterval(id);
        setRunning(false);
        setRemaining(0);
        setFlash(true);
        alertDone();
        setTimeout(() => {
          setFlash(false);
          setRemaining(null);
        }, 1600);
      }
    }, 200);
    return () => clearInterval(id);
  }, [running]);

  const start = () => {
    ensureCtx();
    endRef.current = Date.now() + seconds * 1000;
    setRemaining(seconds);
    setFlash(false);
    setRunning(true);
  };
  const resume = () => {
    ensureCtx();
    endRef.current = Date.now() + remaining * 1000;
    setRunning(true);
  };
  const reset = () => {
    setRunning(false);
    setRemaining(null);
    setFlash(false);
  };
  const mainAction = () => {
    if (flash) return reset();
    if (remaining === null) return start();
    if (running) return setRunning(false);
    return resume();
  };
  const adjust = (d) => {
    if (remaining === null) {
      setSeconds(Math.min(600, Math.max(15, seconds + d)));
    } else {
      const nr = Math.min(600, Math.max(0, remaining + d));
      setRemaining(nr);
      if (running) endRef.current = Date.now() + nr * 1000;
    }
  };

  const active = remaining !== null;
  const shown = active ? remaining : seconds;
  const pct = flash ? 100 : active ? (seconds > 0 ? (remaining / seconds) * 100 : 0) : 100;
  const fill = flash ? "#16A34A" : active && remaining <= 10 ? "#B45309" : "#15803D";
  const label = flash ? "Pause vorbei" : remaining === null ? "Start" : running ? "Läuft" : "Weiter";
  const presets = [60, 90, 120, 180];

  return (
    <div
      className="sticky bottom-3 z-20 rounded-2xl border border-neutral-800 shadow-lg p-3"
      style={{ backgroundColor: "#1C1C1F" }}
    >
      <div className="flex items-center justify-between mb-2">
        <span className="uppercase tracking-wider text-neutral-500" style={{ fontSize: 11 }}>
          Satzpause
        </span>
        {!active && (
          <div className="flex gap-1">
            {presets.map((p) => (
              <button
                key={p}
                onClick={() => setSeconds(p)}
                className={"text-xs rounded-full px-2 py-0.5 " + (seconds === p ? "text-neutral-900" : "bg-neutral-800 text-neutral-400")}
                style={seconds === p ? { backgroundColor: "#F5F5F4" } : {}}
              >
                {mmss(p)}
              </button>
            ))}
          </div>
        )}
      </div>
      <div className="flex items-center gap-2">
        <button onClick={() => adjust(-15)} aria-label="minus 15 Sekunden" className="shrink-0 w-11 h-12 rounded-xl bg-neutral-800 text-neutral-300 text-xs font-semibold">
          −15
        </button>
        <button onClick={mainAction} className="flex-1 relative overflow-hidden rounded-xl h-12 bg-neutral-800 flex items-center justify-center gap-2">
          <div
            className="absolute left-0 top-0 bottom-0"
            style={{ width: pct + "%", backgroundColor: fill, opacity: 0.4, transition: "width .2s linear" }}
          />
          <span className="relative font-mono tabular-nums text-lg text-neutral-100">{mmss(shown)}</span>
          <span className="relative text-neutral-100">
            {flash ? <Check size={18} /> : remaining === null || !running ? <Play size={18} fill="currentColor" /> : <Pause size={18} fill="currentColor" />}
          </span>
          <span className="relative text-sm text-neutral-300">{label}</span>
        </button>
        <button onClick={() => adjust(15)} aria-label="plus 15 Sekunden" className="shrink-0 w-11 h-12 rounded-xl bg-neutral-800 text-neutral-300 text-xs font-semibold">
          +15
        </button>
        {active && (
          <button onClick={reset} aria-label="Pause abbrechen" className="shrink-0 w-11 h-12 rounded-xl bg-neutral-800 text-neutral-400 flex items-center justify-center">
            <RotateCcw size={18} />
          </button>
        )}
      </div>
    </div>
  );
}

/* ================================================================== */
/*  Übungs-Auswahl (Modal)                                             */
/* ================================================================== */
function ExercisePicker({ withName, initialName = "", initialSelected = [], library, title, confirmLabel, onConfirm, onCancel, onAddCustom }) {
  const [name, setName] = useState(initialName);
  const [selected, setSelected] = useState(initialSelected);
  const [custom, setCustom] = useState("");

  const isSel = (n) => selected.some((x) => norm(x) === norm(n));
  const toggle = (n) => setSelected((prev) => (isSel(n) ? prev.filter((x) => norm(x) !== norm(n)) : [...prev, n]));
  const remove = (n) => setSelected((prev) => prev.filter((x) => norm(x) !== norm(n)));
  const addCustom = () => {
    const v = custom.trim();
    if (!v) return;
    if (!isSel(v)) setSelected((prev) => [...prev, v]);
    if (onAddCustom) onAddCustom(v);
    setCustom("");
  };
  const valid = (!withName || name.trim()) && selected.length > 0;

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ backgroundColor: "rgba(0,0,0,0.6)" }} onClick={onCancel}>
      <div onClick={(e) => e.stopPropagation()} className="w-full max-w-md bg-neutral-900 rounded-t-3xl p-4" style={{ maxHeight: "90vh", overflowY: "auto" }}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="text-lg font-semibold text-neutral-100">{title}</h3>
          <button onClick={onCancel} aria-label="Schließen" className="text-neutral-500 p-1">
            <X size={20} />
          </button>
        </div>

        {withName && (
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Plan-Name (z. B. Arme)" className={"w-full mb-3 " + inputCls} />
        )}

        {selected.length > 0 && (
          <div className="mb-3">
            <div className="uppercase tracking-wider text-neutral-600 mb-1" style={{ fontSize: 11 }}>
              Ausgewählt · Reihenfolge
            </div>
            <div className="space-y-1">
              {selected.map((n, i) => (
                <div key={n + i} className="flex items-center justify-between bg-neutral-800 rounded-lg px-3 py-2">
                  <span className="text-neutral-100 text-sm">
                    <span className="font-mono text-neutral-500">{i + 1}.</span> {n}
                  </span>
                  <button onClick={() => remove(n)} aria-label="entfernen" className="text-neutral-500">
                    <X size={15} />
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="flex gap-2 mb-4">
          <input
            value={custom}
            onChange={(e) => setCustom(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addCustom()}
            placeholder="Eigene Übung / Gerät…"
            className={"flex-1 " + inputCls}
          />
          <button onClick={addCustom} aria-label="hinzufügen" className="shrink-0 w-12 rounded-xl text-white flex items-center justify-center active:opacity-80" style={{ backgroundColor: RED }}>
            <Plus size={22} />
          </button>
        </div>

        <div className="space-y-4">
          {Object.entries(library).map(([cat, names]) => (
            <div key={cat}>
              <div className="uppercase tracking-wider text-neutral-500 mb-2" style={{ fontSize: 11 }}>
                {cat}
              </div>
              <div className="flex flex-wrap gap-2">
                {names.map((n) => {
                  const sel = isSel(n);
                  return (
                    <button
                      key={n}
                      onClick={() => toggle(n)}
                      className={"text-sm rounded-full px-3 py-1.5 flex items-center gap-1 border " + (sel ? "border-transparent" : "border-neutral-700 text-neutral-300")}
                      style={sel ? { backgroundColor: "#F5F5F4", color: "#171717" } : {}}
                    >
                      {sel && <Check size={13} />}
                      {n}
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
        </div>

        <div className="sticky bottom-0 bg-neutral-900 pt-3 mt-3 flex gap-2">
          <button onClick={onCancel} className="flex-1 py-3 rounded-xl bg-neutral-800 text-neutral-300 font-medium">
            Abbrechen
          </button>
          <button
            onClick={() => valid && onConfirm({ name: name.trim(), names: selected })}
            disabled={!valid}
            className="flex-1 py-3 rounded-xl text-white font-semibold"
            style={{ backgroundColor: valid ? RED : "#3F3F46", opacity: valid ? 1 : 0.6 }}
          >
            {confirmLabel}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ================================================================== */
/*  Übungs-Karte (im Training, editierbar)                             */

function ExerciseCard({ ex, last, bestEver, onUpdateSet, onAddSet, onRemoveSet, onRemove }) {
  const today = topSet(ex.sets);
  const prevTop = last ? topSet(last.exercise.sets) : null;
  const topDelta = today && prevTop ? num(today.weight) - num(prevTop.weight) : null;
  const isPR = today && bestEver != null && num(today.weight) > bestEver;

  return (
    <div className="rounded-2xl bg-neutral-900 border border-neutral-800 overflow-hidden">
      <div className="flex items-center justify-between px-4 pt-3 pb-2">
        <div className="flex items-center gap-2 min-w-0">
          <span className="font-semibold text-neutral-100 truncate">{ex.name}</span>
          {isPR && (
            <span className="shrink-0 inline-flex items-center gap-1 text-xs font-bold px-2 py-0.5 rounded-full" style={{ backgroundColor: "#78350F", color: "#FCD34D" }}>
              <Trophy size={12} /> PR
            </span>
          )}
        </div>
        <button onClick={onRemove} aria-label="Übung entfernen" className="text-neutral-600 hover:text-neutral-400 p-1">
          <X size={16} />
        </button>
      </div>

      {last && prevTop ? (
        <div className="px-4 pb-2 text-xs text-neutral-500">
          Letztes Mal · vor {daysAgo(last.date)} Tg. ·{" "}
          <span className="font-mono text-neutral-400">
            Bestsatz {fmt(prevTop.reps)}×{fmt(prevTop.weight)} kg
          </span>
        </div>
      ) : (
        <div className="px-4 pb-2 text-xs text-neutral-600">Erstes Mal — heute wird der Startwert.</div>
      )}

      <div className="px-4">
        <div className="gap-2 uppercase tracking-wider text-neutral-600 pb-1" style={{ ...GRID, fontSize: 11 }}>
          <div>Satz</div>
          <div className="text-center">Whg</div>
          <div className="text-center">kg</div>
          <div className="text-right">vs.</div>
        </div>
        {ex.sets.map((s, i) => {
          const lastW = last ? num(last.exercise.sets[i]?.weight) : 0;
          const d = last && lastW ? num(s.weight) - lastW : null;
          return (
            <div key={i} className="gap-2 items-center py-1.5 border-t border-neutral-800" style={GRID}>
              <div className="font-mono text-neutral-500 text-sm">{i + 1}</div>
              <div className="flex justify-center">
                <NumField value={s.reps} onChange={(v) => onUpdateSet(i, "reps", v)} step={1} ariaLabel="Wiederholungen" />
              </div>
              <div className="flex justify-center">
                <NumField value={s.weight} onChange={(v) => onUpdateSet(i, "weight", v)} step={2.5} ariaLabel="Gewicht in kg" />
              </div>
              <div className="flex items-center justify-end gap-1">
                {d != null && num(s.weight) > 0 ? (
                  <span className="font-mono text-xs tabular-nums" style={{ color: deltaColor(d) }}>
                    {deltaText(d)}
                  </span>
                ) : (
                  <span className="text-neutral-700 text-xs">—</span>
                )}
                {ex.sets.length > 1 && (
                  <button onClick={() => onRemoveSet(i)} aria-label="Satz löschen" className="text-neutral-700 hover:text-neutral-500">
                    <Trash2 size={13} />
                  </button>
                )}
              </div>
            </div>
          );
        })}
      </div>

      <div className="px-4 pt-2">
        <button onClick={onAddSet} className="w-full text-sm text-neutral-400 py-2 rounded-lg border border-dashed border-neutral-700 hover:border-neutral-600 hover:text-neutral-300 flex items-center justify-center gap-1">
          <Plus size={14} /> Satz
        </button>
      </div>

      {today && (
        <div className="mt-3 px-4 py-3 border-t border-neutral-800" style={{ backgroundColor: "#141414" }}>
          <PlateBar weight={num(today.weight)} />
          <div className="flex items-center justify-center gap-2 mt-1 flex-wrap">
            <span className="uppercase tracking-wider text-neutral-600" style={{ fontSize: 11 }}>
              Bestsatz heute
            </span>
            <span className="font-mono tabular-nums text-neutral-100">
              {fmt(today.reps)}×{fmt(today.weight)} kg
            </span>
            {topDelta != null && (
              <span className="font-mono text-sm tabular-nums font-semibold" style={{ color: deltaColor(topDelta) }}>
                {deltaText(topDelta)} kg
              </span>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ================================================================== */
/*  Pläne-Ansicht                                                      */
/* ================================================================== */
function PlansView({ plans, setPlans, library, onAddCustom }) {
  const [draft, setDraft] = useState(null);

  const save = ({ name, names }) => {
    setPlans((prev) =>
      draft.id ? prev.map((p) => (p.id === draft.id ? { ...p, name, exercises: names } : p)) : [...prev, { id: uid(), name, exercises: names }]
    );
    onAddCustom(names);
    setDraft(null);
  };
  const del = (id) => setPlans((prev) => prev.filter((p) => p.id !== id));

  return (
    <div className="space-y-3 pt-1">
      <button onClick={() => setDraft({ id: null, name: "", exercises: [] })} className="w-full py-3 rounded-xl text-white font-semibold flex items-center justify-center gap-2 active:opacity-80" style={{ backgroundColor: RED }}>
        <Plus size={18} /> Neuer Plan
      </button>

      {plans.length === 0 ? (
        <div className="text-center py-12 px-6">
          <ClipboardList size={32} className="mx-auto text-neutral-700" />
          <p className="mt-3 text-neutral-400 font-medium">Noch keine Pläne</p>
          <p className="mt-1 text-sm text-neutral-600">
            Fass ein paar Übungen unter einem Namen zusammen — z. B. „Arme" mit Bizeps- und Trizeps-Übungen. Im Tab Heute startest du dann mit einem Tipp.
          </p>
        </div>
      ) : (
        plans.map((p) => (
          <div key={p.id} className="rounded-2xl bg-neutral-900 border border-neutral-800 p-4">
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <div className="font-semibold text-neutral-100">{p.name}</div>
                <div className="text-xs text-neutral-500 mt-0.5">
                  {p.exercises.length} Übungen · {p.exercises.slice(0, 4).join(", ")}
                  {p.exercises.length > 4 ? " …" : ""}
                </div>
              </div>
              <div className="flex items-center gap-1 shrink-0">
                <button onClick={() => setDraft({ id: p.id, name: p.name, exercises: p.exercises })} aria-label="bearbeiten" className="text-neutral-500 hover:text-neutral-300 p-1.5">
                  <Pencil size={16} />
                </button>
                <button onClick={() => del(p.id)} aria-label="löschen" className="text-neutral-500 hover:text-neutral-300 p-1.5">
                  <Trash2 size={16} />
                </button>
              </div>
            </div>
          </div>
        ))
      )}

      {draft && (
        <ExercisePicker
          withName
          initialName={draft.name}
          initialSelected={draft.exercises}
          library={library}
          title={draft.id ? "Plan bearbeiten" : "Neuer Plan"}
          confirmLabel="Plan speichern"
          onConfirm={save}
          onCancel={() => setDraft(null)}
          onAddCustom={(n) => onAddCustom([n])}
        />
      )}
    </div>
  );
}

/* ================================================================== */
/*  GYM-Ansicht (Haupt-App)                                            */
/* ================================================================== */
function GymView({ sessions, setSessions, plans, setPlans, customExercises, setCustomExercises, restSeconds, setRestSeconds }) {
  const [tab, setTab] = useState("heute"); // heute | plaene | verlauf
  const [addOpen, setAddOpen] = useState(false);
  const [confirmDiscard, setConfirmDiscard] = useState(false);
  const today = isoLocal();

  const todaySession = sessions.find((s) => s.date === today);

  const library = useMemo(() => {
    const customs = [];
    const seen = new Set(CATALOG_NAMES);
    const push = (n) => {
      if (!seen.has(norm(n))) {
        seen.add(norm(n));
        customs.push(n);
      }
    };
    customExercises.forEach(push);
    plans.forEach((p) => p.exercises.forEach(push));
    sessions.forEach((s) => s.exercises.forEach((e) => push(e.name)));
    const obj = {};
    Object.entries(CATALOG).forEach(([k, v]) => (obj[k] = v));
    if (customs.length) obj["Eigene Übungen"] = customs;
    return obj;
  }, [customExercises, plans, sessions]);

  const findLastTime = useCallback(
    (name) => {
      const matches = sessions.filter((s) => s.date < today && s.exercises.some((e) => norm(e.name) === norm(name)));
      if (!matches.length) return null;
      matches.sort((a, b) => (a.date < b.date ? 1 : -1));
      const s = matches[0];
      return { date: s.date, exercise: s.exercises.find((e) => norm(e.name) === norm(name)) };
    },
    [sessions, today]
  );

  const bestEver = useCallback(
    (name) => {
      let best = null;
      sessions.forEach((s) => {
        if (s.date === today) return;
        s.exercises
          .filter((e) => norm(e.name) === norm(name))
          .forEach((e) => {
            const t = topSet(e.sets);
            if (t && (best == null || num(t.weight) > best)) best = num(t.weight);
          });
      });
      return best;
    },
    [sessions, today]
  );

  const buildExercise = (name) => {
    const last = findLastTime(name);
    const sets = last ? last.exercise.sets.map((s) => ({ reps: String(s.reps), weight: String(s.weight) })) : [{ reps: "", weight: "" }];
    return { id: uid(), name, sets };
  };

  const addCustoms = (names) => {
    const toAdd = names.filter((n) => !CATALOG_NAMES.has(norm(n)) && !customExercises.some((c) => norm(c) === norm(n)));
    if (toAdd.length) setCustomExercises((prev) => [...prev, ...toAdd]);
  };

  const upsertToday = (mutator) => {
    setSessions((prev) => {
      const idx = prev.findIndex((s) => s.date === today);
      let cur =
        idx >= 0
          ? { ...prev[idx], exercises: prev[idx].exercises.map((e) => ({ ...e, sets: e.sets.map((x) => ({ ...x })) })) }
          : { id: uid(), date: today, title: "", exercises: [] };
      cur = mutator(cur);
      const next = idx >= 0 ? prev.map((s, i) => (i === idx ? cur : s)) : [...prev, cur];
      return next.filter((s) => s.date !== today || s.exercises.length > 0 || (s.title && s.title.length > 0));
    });
  };

  const startPlan = (p) => {
    const exercises = p.exercises.map(buildExercise);
    setSessions((prev) => {
      const idx = prev.findIndex((s) => s.date === today);
      const cur = { id: idx >= 0 ? prev[idx].id : uid(), date: today, title: p.name, exercises };
      return idx >= 0 ? prev.map((s, i) => (i === idx ? cur : s)) : [...prev, cur];
    });
  };

  const startFree = () => {
    setSessions((prev) => {
      if (prev.some((s) => s.date === today)) return prev;
      return [...prev, { id: uid(), date: today, title: "Freies Training", exercises: [] }];
    });
  };

  const discardToday = () => setSessions((prev) => prev.filter((s) => s.date !== today));

  const addExercises = (names) => {
    upsertToday((cur) => {
      names.forEach((name) => {
        if (!cur.exercises.some((e) => norm(e.name) === norm(name))) cur.exercises.push(buildExercise(name));
      });
      return cur;
    });
    addCustoms(names);
    setAddOpen(false);
  };

  const updateSet = (exId, i, field, val) =>
    upsertToday((cur) => {
      const e = cur.exercises.find((x) => x.id === exId);
      if (e) e.sets[i][field] = val;
      return cur;
    });
  const addSet = (exId) =>
    upsertToday((cur) => {
      const e = cur.exercises.find((x) => x.id === exId);
      if (e) {
        const prev = e.sets[e.sets.length - 1];
        e.sets.push({ reps: prev ? prev.reps : "", weight: prev ? prev.weight : "" });
      }
      return cur;
    });
  const removeSet = (exId, i) =>
    upsertToday((cur) => {
      const e = cur.exercises.find((x) => x.id === exId);
      if (e) e.sets.splice(i, 1);
      return cur;
    });
  const removeExercise = (exId) =>
    upsertToday((cur) => {
      cur.exercises = cur.exercises.filter((x) => x.id !== exId);
      return cur;
    });

  const past = useMemo(() => sessions.filter((s) => s.date < today && hasData(s)).sort((a, b) => (a.date < b.date ? 1 : -1)), [sessions, today]);

  return (
    <div>
      <div className="flex justify-center py-3">
        <Segmented
          value={tab}
          onChange={(t) => {
            setTab(t);
            setConfirmDiscard(false);
          }}
          options={[
            { value: "heute", label: "Heute" },
            { value: "plaene", label: "Pläne" },
            { value: "verlauf", label: "Verlauf" },
          ]}
        />
      </div>

      {tab === "plaene" && <PlansView plans={plans} setPlans={setPlans} library={library} onAddCustom={addCustoms} />}

      {tab === "verlauf" && <HistoryView past={past} />}

      {tab === "heute" && !todaySession && (
        <div className="space-y-4">
          <div className="flex items-center gap-2 text-sm text-neutral-500 px-1">
            <CalendarDays size={15} />
            <span className="capitalize">{formatDe(today)}</span>
          </div>
          <h2 className="text-xl font-semibold text-neutral-100 px-1">Training starten</h2>

          {plans.length === 0 ? (
            <div className="rounded-2xl bg-neutral-900 border border-neutral-800 p-5 text-center">
              <p className="text-sm text-neutral-400">Du hast noch keine Pläne. Leg zuerst einen an — dann startest du hier mit einem Tipp.</p>
              <button onClick={() => setTab("plaene")} className="mt-3 px-4 py-2 rounded-xl text-white font-medium" style={{ backgroundColor: RED }}>
                Plan erstellen
              </button>
            </div>
          ) : (
            <div className="space-y-2">
              {plans.map((p) => (
                <button key={p.id} onClick={() => startPlan(p)} className="w-full text-left rounded-2xl bg-neutral-900 border border-neutral-800 p-4 flex items-center justify-between gap-3 active:border-neutral-700">
                  <div className="min-w-0">
                    <div className="font-semibold text-neutral-100">{p.name}</div>
                    <div className="text-xs text-neutral-500 mt-0.5 truncate">
                      {p.exercises.length} Übungen · {p.exercises.slice(0, 3).join(", ")}
                      {p.exercises.length > 3 ? " …" : ""}
                    </div>
                  </div>
                  <span className="shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-white" style={{ backgroundColor: RED }}>
                    <Play size={18} fill="currentColor" />
                  </span>
                </button>
              ))}
            </div>
          )}

          <button onClick={startFree} className="w-full py-3 rounded-xl border border-neutral-700 text-neutral-300 font-medium flex items-center justify-center gap-2">
            <Dumbbell size={16} /> Freies Training
          </button>
        </div>
      )}

      {tab === "heute" && todaySession && (
        <div className="space-y-3">
          <div className="flex items-start justify-between">
            <div>
              <div className="flex items-center gap-2 text-sm text-neutral-500">
                <CalendarDays size={15} />
                <span className="capitalize">{formatDe(today)}</span>
              </div>
              <h2 className="text-xl font-semibold text-neutral-100 mt-0.5">{todaySession.title || "Training"}</h2>
            </div>
            {confirmDiscard ? (
              <div className="flex items-center gap-2 pt-1">
                <span className="text-xs text-neutral-500">Verwerfen?</span>
                <button
                  onClick={() => {
                    discardToday();
                    setConfirmDiscard(false);
                  }}
                  className="text-xs font-semibold"
                  style={{ color: "#F87171" }}
                >
                  Ja
                </button>
                <button onClick={() => setConfirmDiscard(false)} className="text-xs text-neutral-400">
                  Nein
                </button>
              </div>
            ) : (
              <button onClick={() => setConfirmDiscard(true)} className="text-xs text-neutral-600 hover:text-neutral-400 pt-1">
                Verwerfen
              </button>
            )}
          </div>

          {todaySession.exercises.map((ex) => (
            <ExerciseCard
              key={ex.id}
              ex={ex}
              last={findLastTime(ex.name)}
              bestEver={bestEver(ex.name)}
              onUpdateSet={(i, f, v) => updateSet(ex.id, i, f, v)}
              onAddSet={() => addSet(ex.id)}
              onRemoveSet={(i) => removeSet(ex.id, i)}
              onRemove={() => removeExercise(ex.id)}
            />
          ))}

          {todaySession.exercises.length === 0 && (
            <div className="text-center py-8 px-6 text-sm text-neutral-600">Noch keine Übung. Füg unten welche aus der Bibliothek hinzu.</div>
          )}

          <button onClick={() => setAddOpen(true)} className="w-full py-3 rounded-xl border border-dashed border-neutral-700 text-neutral-300 font-medium flex items-center justify-center gap-2 hover:border-neutral-600">
            <Plus size={16} /> Übung hinzufügen
          </button>

          <RestTimer seconds={restSeconds} setSeconds={setRestSeconds} />
        </div>
      )}

      {addOpen && (
        <ExercisePicker
          library={library}
          title="Übungen hinzufügen"
          confirmLabel="Hinzufügen"
          onConfirm={({ names }) => addExercises(names)}
          onCancel={() => setAddOpen(false)}
          onAddCustom={(n) => addCustoms([n])}
        />
      )}
    </div>
  );
}

function HistoryView({ past }) {
  const [open, setOpen] = useState(null);
  if (!past.length)
    return <div className="text-center py-14 text-neutral-600 text-sm">Noch kein Verlauf. Nach deinem ersten Training tauchen hier alle Einheiten auf.</div>;
  return (
    <div className="space-y-2">
      {past.map((s) => {
        const isOpen = open === s.id;
        const totalVol = s.exercises.reduce((a, e) => a + volume(e.sets), 0);
        return (
          <div key={s.id} className="rounded-2xl bg-neutral-900 border border-neutral-800 overflow-hidden">
            <button onClick={() => setOpen(isOpen ? null : s.id)} className="w-full flex items-center justify-between px-4 py-3 text-left">
              <div>
                <div className="text-neutral-100 font-medium capitalize">
                  {s.title ? s.title + " · " : ""}
                  {formatDe(s.date)}
                </div>
                <div className="text-xs text-neutral-500 font-mono">
                  {s.exercises.length} Übungen · {fmt(totalVol)} kg Volumen
                </div>
              </div>
              {isOpen ? <ChevronDown size={18} className="text-neutral-500" /> : <ChevronRight size={18} className="text-neutral-500" />}
            </button>
            {isOpen && (
              <div className="px-4 pb-3 space-y-3">
                {s.exercises.map((e) => (
                  <div key={e.id}>
                    <div className="text-sm font-medium text-neutral-300 mb-1">{e.name}</div>
                    <div className="flex flex-wrap gap-1.5">
                      {e.sets
                        .filter((x) => num(x.weight) > 0 || num(x.reps) > 0)
                        .map((x, i) => (
                          <span key={i} className="font-mono text-xs tabular-nums text-neutral-400 bg-neutral-800 rounded px-2 py-0.5">
                            {fmt(x.reps)}×{fmt(x.weight)}
                          </span>
                        ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ================================================================== */
/*  App                                                                */
/* ================================================================== */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [sessions, setSessions] = useState([]);
  const [plans, setPlans] = useState([]);
  const [customExercises, setCustomExercises] = useState([]);
  const [restSeconds, setRestSeconds] = useState(90);

  useEffect(() => {
    (async () => {
      const parse = (v, fb) => {
        try {
          return v ? JSON.parse(v) : fb;
        } catch {
          return fb;
        }
      };
      setSessions(parse(await store.get("logbuch:sessions"), []));
      setPlans(parse(await store.get("logbuch:plans"), []));
      setCustomExercises(parse(await store.get("logbuch:customExercises"), []));
      const rs = parse(await store.get("logbuch:restSeconds"), 90);
      if (typeof rs === "number" && rs >= 15) setRestSeconds(rs);
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (loaded) store.set("logbuch:sessions", JSON.stringify(sessions));
  }, [sessions, loaded]);
  useEffect(() => {
    if (loaded) store.set("logbuch:plans", JSON.stringify(plans));
  }, [plans, loaded]);
  useEffect(() => {
    if (loaded) store.set("logbuch:customExercises", JSON.stringify(customExercises));
  }, [customExercises, loaded]);
  useEffect(() => {
    if (loaded) store.set("logbuch:restSeconds", JSON.stringify(restSeconds));
  }, [restSeconds, loaded]);

  return (
    <div className="min-h-screen bg-neutral-950 text-neutral-100" style={{ fontFamily: "system-ui, sans-serif" }}>
      <div className="max-w-md mx-auto px-4 pb-16">
        <header className="sticky top-0 z-10 bg-neutral-950 pt-4 pb-2">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg flex items-center justify-center" style={{ backgroundColor: RED }}>
              <Dumbbell size={18} className="text-white" />
            </div>
            <div>
              <div className="font-mono font-bold tracking-widest text-neutral-100 leading-none">LOGBUCH</div>
              <div className="uppercase tracking-widest text-neutral-600 leading-none mt-0.5" style={{ fontSize: 10 }}>
                Woche für Woche stärker
              </div>
            </div>
          </div>
        </header>

        {!loaded ? (
          <div className="text-center py-20 text-neutral-600 text-sm">Lädt …</div>
        ) : (
          <GymView
            sessions={sessions}
            setSessions={setSessions}
            plans={plans}
            setPlans={setPlans}
            customExercises={customExercises}
            setCustomExercises={setCustomExercises}
            restSeconds={restSeconds}
            setRestSeconds={setRestSeconds}
          />
        )}

        <p className="text-center text-neutral-700 mt-8" style={{ fontSize: 11 }}>
          Deine Daten werden auf diesem Gerät gespeichert.
        </p>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
